<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RX¹⁷ | Painel</title><style>
*{box-sizing:border-box}body{margin:0;background:#09070d;color:#eee;font-family:Arial,sans-serif;padding:24px}main{max-width:1000px;margin:auto}.panel{background:#17121e;border:1px solid #3a254b;border-radius:15px;padding:22px;margin:16px 0}input,button{padding:12px;border-radius:9px;border:1px solid #604079;background:#21182b;color:#fff}button{background:#8b36d9;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:150px;background:#21182b;padding:18px;border-radius:12px}.stat b{font-size:26px;color:#d4a5ff}.visit{border-bottom:1px solid #332044;padding:14px 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}.muted{color:#b9a9c7}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #332044}
</style></head><body><main><h1 style="color:#c58aff">RX¹⁷ • Painel de Controle</h1><div id="login" class="panel"><h2>Entrar</h2><p>Área privada do administrador.</p><div class="row"><input id="password" type="password" placeholder="Senha administrativa"><button onclick="login()">Entrar</button></div><p id="error" style="color:#ff8080"></p></div><div id="dashboard" hidden><div class="stats"><div class="stat"><span class="muted">Registros</span><br><b id="total">0</b></div><div class="stat"><span class="muted">Hoje</span><br><b id="today">0</b></div></div><div class="panel"><div class="row" style="justify-content:space-between;align-items:center"><h2>Visitas recentes</h2><button onclick="load()">Atualizar</button><button onclick="logout()">Sair</button></div><div id="visits"></div></div></div></main><script>
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("password").value})});if(r.ok){document.getElementById("login").hidden=true;document.getElementById("dashboard").hidden=false;load()}else document.getElementById("error").textContent="Senha incorreta."}
async function load(){let r=await fetch("/api/visits");if(!r.ok)return;let v=await r.json();document.getElementById("total").textContent=v.length;let today=new Date().toLocaleDateString();document.getElementById("today").textContent=v.filter(x=>new Date(x.time).toLocaleDateString()===today).length;document.getElementById("visits").innerHTML=v.map(x=>`<div class="visit"><b>${escapeHtml(x.nickname)}</b><span>${new Date(x.time).toLocaleString()}</span><span>Dispositivo: ${escapeHtml(x.device)}</span><span>Página: ${escapeHtml(x.page)}</span></div>`).join("")||"<p>Nenhuma visita registrada ainda.</p>"}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
</script></body></html>
